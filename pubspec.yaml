name: reminders_alerts
description: A calm, local-first Arabic reminders application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  path: ^1.9.1
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.3.6
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  cryptography: ^2.7.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
